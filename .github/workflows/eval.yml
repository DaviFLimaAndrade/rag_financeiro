name: RAG Eval

on:
  workflow_dispatch:
    inputs:
      run_judge:
        description: "Rodar também a avaliação LLM-as-judge (consome cota de API)"
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - "src/rag_financeiro/**"
      - "scripts/evaluate.py"
      - "scripts/evaluate_retrieval.py"
      - "scripts/evaluate_routing.py"
      - "scripts/validate_golden.py"
      - "scripts/ingest.py"
      - "data/golden_dataset_reduzido.jsonl"
      - "data/routing_dataset.jsonl"
      - "data/raw/**"
      - "requirements.txt"
      - "pyproject.toml"

permissions:
  contents: write

concurrency:
  group: rag-eval
  cancel-in-progress: false

jobs:
  evaluate:
    runs-on: ubuntu-latest
    env:
      LLM_PROVIDER: groq
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      JUDGE_PROVIDER: openrouter
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -e .

      - name: Cache vector store
        id: chroma-cache
        uses: actions/cache@v4
        with:
          path: data/processed/chroma_db
          key: chroma-v1-${{ hashFiles('data/raw/**/*.pdf', 'src/rag_financeiro/ingestion/**', 'src/rag_financeiro/embeddings/**', 'src/rag_financeiro/config.py') }}

      - name: Ingest PDFs (cache miss only)
        if: steps.chroma-cache.outputs.cache-hit != 'true'
        run: python scripts/ingest.py

      - name: Validate golden dataset
        run: python scripts/validate_golden.py

      - name: Evaluate retrieval (offline)
        run: python scripts/evaluate_retrieval.py

      - name: Build retrieval badge
        run: python scripts/build_retrieval_badge.py

      - name: Evaluate intent routing (offline)
        run: python scripts/evaluate_routing.py

      - name: Run LLM-as-judge evaluation
        if: github.event_name == 'workflow_dispatch' && inputs.run_judge
        run: python scripts/evaluate.py

      - name: Build LLM-as-judge badge
        if: github.event_name == 'workflow_dispatch' && inputs.run_judge
        run: python scripts/build_eval_badge.py

      - name: Upload evaluation results
        uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: |
            retrieval_results.json
            routing_results.json
            eval_results.json
          if-no-files-found: warn

      - name: Commit badges back to main
        run: |
          git config user.name "Davi Andrade"
          git config user.email "141194513+DaviFLimaAndrade@users.noreply.github.com"
          git add retrieval_badge.json eval_badge.json
          git diff --cached --quiet && echo "Sem mudança nos badges, nada a commitar." && exit 0
          git commit -m "chore: atualiza badges de avaliação do RAG [skip ci]"
          git pull --rebase
          git push
