name: keepalive

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping app
        env:
          APP_URL: https://ragfinanceiro-ysa8w5g6k7dzvz4kikaqfd.streamlit.app/
        run: |
          code=$(curl -sS -L -c jar.txt -b jar.txt --max-redirs 5 \
            -o /dev/null -w '%{http_code}' \
            --max-time 60 --retry 3 --retry-delay 20 "$APP_URL")
          echo "HTTP $code"
          [ "$code" = "200" ]
